services:
  mysql:
    image: mysql:8.0
    container_name: autoservis
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autoservis
      MYSQL_USER: autoservis_user
      MYSQL_PASSWORD: autoservis123
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  mysql_data: